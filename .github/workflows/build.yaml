# Re-renders the profile card SVGs and commits them back to main.
# The test suite gates the render step, so a broken card can never be committed
# over a working one.
name: Build profile card

# Deliberately not triggered by `push`. The bot commits the rendered SVGs back to
# main, so rendering on push means every push you make is immediately followed by a
# bot commit on the same two files -- and the next local commit conflicts.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python3 -m unittest discover -q

      - name: Render SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python3 today.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          # -I skips the timestamp line: it changes on every run, so without this
          # the cron commits four times a day whether anything moved or not.
          git diff --staged -I 'Last checked' --quiet && echo "no change" && exit 0
          git commit -m "Update profile card"
          git push
